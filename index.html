<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıkıştırılmış Tek QR - Emir</title>
    <!-- QR, Okuyucu ve Sıkıştırma Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; padding: 20px; }
        .container { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .panel { border: 2px solid #333; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; background: #1e1e1e; }
        button { background: #00ff88; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; margin-top: 10px;}
        canvas { max-width: 100%; background: #000; border-radius: 5px; margin-top:10px; }
        video { display: none; }
        #warning { color: #ff4444; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <h2>⚡ Yüksek Kapasiteli Tek QR</h2>
    <div class="container">
        <!-- GÖNDERİCİ -->
        <div class="panel">
            <h3>📤 Gönderici</h3>
            <input type="file" id="fileInput">
            <p id="warning">⚠️ Dosya tek QR için çok büyük!</p>
            <canvas id="qrCanvas" width="300" height="300" style="display:none;"></canvas>
        </div>
        
        <!-- ALICI -->
        <div class="panel">
            <h3>📥 Alıcı</h3>
            <button onclick="startScanner()">📷 Kamerayı Aç</button>
            <video id="video" playsinline></video>
            <canvas id="scanCanvas" width="300" height="300" style="display:none;"></canvas>
            <p id="receiveProgress">Bekleniyor...</p>
        </div>
    </div>

    <script>
        // --- GÖNDERİCİ ---
        const fileInput = document.getElementById('fileInput');
        const qrCanvas = document.getElementById('qrCanvas');
        const warning = document.getElementById('warning');
        
        // Level 'L' ile daha az detaylı/sade bir QR oluşturulur
        let qr = new QRious({ element: qrCanvas, size: 300, level: 'L' });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const base64Data = event.target.result;
                // Veriyi sıkıştırıyoruz
                const compressedData = LZString.compressToBase64(base64Data);
                
                // Standart QR kapasite kontrolü (yaklaşık 2900 karakter)
                if (compressedData.length > 2900) {
                    warning.style.display = "block";
                    qrCanvas.style.display = "none";
                } else {
                    warning.style.display = "none";
                    qr.value = compressedData;
                    qrCanvas.style.display = "block";
                }
            };
            reader.readAsDataURL(file);
        });

        // --- ALICI ---
        const video = document.getElementById('video');
        const scanCanvas = document.getElementById('scanCanvas');
        const ctx = scanCanvas.getContext('2d');
        const receiveProgress = document.getElementById('receiveProgress');

        function startScanner() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(stream) {
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                scanCanvas.style.display = "block";
                requestAnimationFrame(tick);
            });
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
                const imageData = ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
                // dontInvert hızı artırır
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                if (code) {
                    // Taranan veriyi çöz
                    const decompressed = LZString.decompressFromBase64(code.data);
                    if (decompressed) {
                        receiveProgress.innerText = "✅ Dosya Başarıyla Okundu!";
                        receiveProgress.style.color = "#00ff88";
                        // Burada 'decompressed' değişkeni orijinal dosyandır.
                    }
                }
            }
            requestAnimationFrame(tick); 
        }
    </script>
</body>
</html>
