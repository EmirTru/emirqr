<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro GZIP QR Transfer - Emir</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --primary: #00ff88; --text: #fff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #333; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: #000; }
        .panel { background: var(--panel); border: 1px solid #333; border-radius: 10px; padding: 20px; width: 100%; max-width: 450px; display: none; text-align: center; }
        .panel.active { display: block; }
        button.action-btn { background: var(--primary); color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; margin-top: 15px; width: 100%; }
        canvas { max-width: 100%; background: #000; border-radius: 5px; margin-top: 15px; }
        video { display: none; }
        .controls { margin-top: 15px; text-align: left; }
        input[type="range"] { width: 100%; }
        .progress-text { font-size: 1.1em; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>⚡ Pro GZIP QR Transfer</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('sender')">📤 Gönderici</button>
        <button class="tab-btn" onclick="switchTab('receiver')">📥 Alıcı</button>
    </div>

    <div id="sender" class="panel active">
        <input type="file" id="fileInput" class="action-btn">
        
        <div class="controls" id="settings" style="display: none;">
            <label>Aktarım Hızı: <span id="fpsValue">5</span> FPS</label>
            <input type="range" id="fpsSlider" min="1" max="30" value="5">
            
            <label style="margin-top:10px; display:block;">Paket Boyutu: <span id="chunkValue">1500</span> Byte</label>
            <input type="range" id="chunkSlider" min="300" max="2500" step="100" value="1500">
        </div>

        <button id="startBtn" class="action-btn" style="display:none;">▶️ Aktarımı Başlat</button>
        <canvas id="qrCanvas" width="450" height="450" style="display:none;"></canvas>
        <p id="sendProgress" class="progress-text">Dosya Seçin...</p>
    </div>

    <div id="receiver" class="panel">
        <button onclick="Receiver.start()" class="action-btn">📷 Kamerayı Aç</button>
        <video id="video" playsinline></video>
        <canvas id="scanCanvas" width="450" height="450" style="display:none;"></canvas>
        <p id="receiveProgress" class="progress-text">Taranan Veri: 0%</p>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        const Sender = {
            chunks: [],
            current: 0,
            isPlaying: false,
            fps: 5,
            chunkSize: 1500,
            base64Data: "",
            lastFrameTime: 0,
            qr: new QRious({ element: document.getElementById('qrCanvas'), size: 450, level: 'L' }),

            init() {
                document.getElementById('fileInput').addEventListener('change', this.handleFile.bind(this));
                document.getElementById('startBtn').addEventListener('click', this.togglePlay.bind(this));
                
                document.getElementById('fpsSlider').addEventListener('input', (e) => {
                    this.fps = e.target.value;
                    document.getElementById('fpsValue').innerText = this.fps;
                });

                document.getElementById('chunkSlider').addEventListener('input', (e) => {
                    this.chunkSize = parseInt(e.target.value);
                    document.getElementById('chunkValue').innerText = this.chunkSize;
                    if (this.base64Data) this.processData();
                });
            },

            handleFile(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                document.getElementById('sendProgress').innerText = "⏳ Sıkıştırılıyor...";
                const reader = new FileReader();
                
                reader.onload = (event) => {
                    // Dosya adı ve veriyi JSON olarak paketleyip GZIP ile sıkıştırıyoruz
                    const payload = JSON.stringify({ name: file.name, data: event.target.result });
                    const compressed = pako.deflate(payload);
                    
                    // Sıkıştırılmış veriyi Base64'e dönüştürüp QR için hazırlıyoruz
                    const blob = new Blob([compressed]);
                    const base64Reader = new FileReader();
                    base64Reader.onload = (e2) => {
                        this.base64Data = e2.target.result.split(',')[1];
                        this.processData();
                        document.getElementById('startBtn').style.display = "block";
                        document.getElementById('settings').style.display = "block";
                    };
                    base64Reader.readAsDataURL(blob);
                };
                reader.readAsDataURL(file);
            },
            
            processData() {
                this.chunks = this.base64Data.match(new RegExp('.{1,' + this.chunkSize + '}', 'g')).map((c, i, a) => `${i}/${a.length}|${c}`);
                document.getElementById('sendProgress').innerText = `Hazır! (${this.chunks.length} Parça)`;
                this.current = 0;
            },

            togglePlay() {
                this.isPlaying = !this.isPlaying;
                const btn = document.getElementById('startBtn');
                if (this.isPlaying) {
                    btn.innerText = "⏸️ Durdur";
                    document.getElementById('qrCanvas').style.display = "inline-block";
                    requestAnimationFrame(this.loop.bind(this));
                } else {
                    btn.innerText = "▶️ Devam Et";
                }
            },

            loop(timestamp) {
                if (!this.isPlaying) return;
                if (timestamp - this.lastFrameTime >= (1000 / this.fps)) {
                    this.qr.value = this.chunks[this.current];
                    document.getElementById('sendProgress').innerText = `Aktarılıyor: ${this.current + 1} / ${this.chunks.length}`;
                    this.current = (this.current + 1) % this.chunks.length;
                    this.lastFrameTime = timestamp;
                }
                requestAnimationFrame(this.loop.bind(this));
            }
        };

        const Receiver = {
            video: document.getElementById('video'),
            canvas: document.getElementById('scanCanvas'),
            ctx: document.getElementById('scanCanvas').getContext('2d'),
            progressEl: document.getElementById('receiveProgress'),
            dataMap: {},
            downloaded: 0,
            total: 0,
            currentSessionTotal: null, 

            start() {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", frameRate: { ideal: 60 } } })
                .then(stream => {
                    this.video.srcObject = stream;
                    this.video.play();
                    this.canvas.style.display = "inline-block";
                    requestAnimationFrame(this.scan.bind(this));
                });
            },

            scan() {
                if (this.video.readyState === this.video.HAVE_ENOUGH_DATA) {
                    this.ctx.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);
                    const imgData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                    const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

                    if (code) this.process(code.data);
                }
                requestAnimationFrame(this.scan.bind(this));
            },

            process(data) {
                const parts = data.split('|');
                if (parts.length < 2) return;
                
                const meta = parts[0].split('/');
                const index = parseInt(meta[0]);
                const newTotal = parseInt(meta[1]);
                
                if (this.currentSessionTotal !== newTotal) {
                    this.dataMap = {};
                    this.downloaded = 0;
                    this.currentSessionTotal = newTotal;
                }

                this.total = newTotal;
                const chunkData = parts[1];
                
                if (!this.dataMap[index]) {
                    this.dataMap[index] = chunkData;
                    this.downloaded++;
                    
                    const pct = Math.round((this.downloaded / this.total) * 100);
                    this.progressEl.innerText = `İndiriliyor: %${pct} (${this.downloaded}/${this.total})`;

                    if (this.downloaded === this.total) this.finish();
                }
            },

            finish() {
                this.progressEl.innerText = "⏳ Veri Çıkartılıyor...";
                let fullData = "";
                for (let i = 0; i < this.total; i++) fullData += this.dataMap[i];
                
                // Base64'ü GZIP ile geri açma işlemi
                fetch('data:application/octet-stream;base64,' + fullData)
                .then(res => res.blob())
                .then(blob => blob.arrayBuffer())
                .then(buffer => {
                    try {
                        const decompressed = pako.inflate(new Uint8Array(buffer), { to: 'string' });
                        const fileData = JSON.parse(decompressed);
                        
                        this.progressEl.innerText = "✅ İndirildi: " + fileData.name;
                        this.progressEl.style.color = "#00ff88";
                        
                        // Orijinal dosya adıyla indirme
                        const link = document.createElement("a");
                        link.href = fileData.data;
                        link.download = fileData.name; 
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                    } catch (err) {
                        this.progressEl.innerText = "❌ Dosya Çözümlenemedi!";
                        this.progressEl.style.color = "#ff4444";
                    }
                });
            }
        };

        Sender.init();
    </script>
</body>
</html>
